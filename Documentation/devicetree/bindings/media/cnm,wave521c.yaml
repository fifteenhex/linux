%YAML 1.2
---
$id: http://devicetree.org/schemas/media/cnm,wave521c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Chips&Media Wave 5 Series multi-standard codec IP

maintainers:
  - Nas Chung <nas.chung@chipsnmedia.com>
  - Jackson Lee <jackson.lee@chipsnmedia.com>

description:
  The Chips&Media WAVE codec IP is a multi format video encoder/decoder

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - ti,j721s2-wave521c
          - const: cnm,wave521c
      - items:
          - const: sstar,ssd20xd-vdec
          - const: cnm,wave511

  reg:
    minItems: 1
    items:
      - description: VPU registers
      - description: SoC wrapper around the VPU, which gates its interrupt

  reg-names:
    minItems: 1
    items:
      - const: vpu
      - const: wrapper

  clocks:
    minItems: 1
    maxItems: 4

  clock-names:
    minItems: 1
    maxItems: 4

  interrupts:
    maxItems: 1

  power-domains:
    maxItems: 1

  resets:
    maxItems: 1

  sram:
    maxItems: 1
    description:
      The VPU uses the SRAM to store some of the reference data instead of
      storing it on DMA memory. It is mainly used for the purpose of reducing
      bandwidth.

required:
  - compatible
  - reg
  - clocks

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: sstar,ssd20xd-vdec
    then:
      properties:
        reg:
          minItems: 2
        reg-names:
          minItems: 2
        clocks:
          minItems: 4
          items:
            - description: APB clock
            - description: AXI clock
            - description: BPU clock
            - description: VCE clock
    else:
      properties:
        reg:
          maxItems: 1
        reg-names:
          maxItems: 1
        clocks:
          items:
            - description: VCODEC clock

additionalProperties: false

examples:
  - |
    vpu: video-codec@12345678 {
        compatible = "ti,j721s2-wave521c", "cnm,wave521c";
        reg = <0x12345678 0x1000>;
        clocks = <&clks 42>;
        interrupts = <42>;
        sram = <&sram>;
    };
